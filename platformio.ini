; SAN viewer - M5StickS3 (ESP32-S3-PICO-1-N8R8)
[platformio]
default_envs = m5sticks3

[env:m5sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DSAN_FIRMWARE_VERSION=\"0.1.0\"
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    m5stack/M5Unified@^0.2.11
    m5stack/M5GFX@^0.2.17
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17

; Tests de la logique pure (hote, sans materiel)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DSAN_NATIVE
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
